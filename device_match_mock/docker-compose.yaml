services:
  web:
    image: nginx:1.27-alpine
    container_name: demo_web
    ports:
      - "8080:80"
    env_file:
      - ./${PORTAINER_EDGE_ID}/env/web.env
    volumes:
      - ./${PORTAINER_EDGE_ID}/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./${PORTAINER_EDGE_ID}/web/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: python:3.12-alpine
    container_name: demo_api
    env_file:
      - ./${PORTAINER_EDGE_ID}/env/api.env
    volumes:
      - ./${PORTAINER_EDGE_ID}/api/app.py:/app/app.py:ro
      - ./${PORTAINER_EDGE_ID}/api/config:/app/config:ro
      - ./${PORTAINER_EDGE_ID}/api/logs:/app/logs
    working_dir: /app
    command:
      - sh
      - -c
      - |
        echo "[boot] API_PORT=${API_PORT} API_MESSAGE=${API_MESSAGE} CONFIG_VERSION=${CONFIG_VERSION}";
        echo "[boot] Config: $(cat /app/config/app-config.json 2>/dev/null || echo 'N/A')";
        last="";
        (
          while true; do
            cur="$( (sha256sum /app/app.py 2>/dev/null; find /app/config -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null) \
              | sha256sum | awk '{print $1}' )";
            if [ "$cur" != "$last" ]; then
              echo "[config-change] api_fingerprint=$cur";
              echo "[config-change] Config: $(cat /app/config/app-config.json 2>/dev/null || echo 'N/A')";
              last="$cur";
            fi
            sleep 3;
          done
        ) &
        python -u /app/app.py
    restart: unless-stopped

  worker:
    image: alpine:3.20
    container_name: demo_worker
    env_file:
      - ./${PORTAINER_EDGE_ID}/env/worker.env
    volumes:
      - ./${PORTAINER_EDGE_ID}/worker/config:/app/config:ro
      - ./${PORTAINER_EDGE_ID}/worker/data:/app/data
    working_dir: /app
    command:
      - sh
      - -c
      - |
        echo "[boot] WORKER_INTERVAL_SECONDS=${WORKER_INTERVAL_SECONDS} WORKER_MESSAGE=${WORKER_MESSAGE} CONFIG_VERSION=${CONFIG_VERSION}";
        echo "[boot] Config: $(cat /app/config/worker.conf 2>/dev/null || echo 'N/A')";
        last="";
        while true; do
          cur="$( (find /app/config /app/data -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null) \
            | sha256sum | awk '{print $1}' )";
          if [ "$cur" != "$last" ]; then
            echo "[config-change] worker_fingerprint=$cur";
            echo "[config-change] Config: $(cat /app/config/worker.conf 2>/dev/null || echo 'N/A')";
            last="$cur";
          fi
          echo "[tick] ${WORKER_MESSAGE}";
          echo "[tick] Config: $(cat /app/config/worker.conf 2>/dev/null || echo 'N/A')";
          sleep "${WORKER_INTERVAL_SECONDS:-5}";
        done
    restart: unless-stopped

networks:
  default:
    name: compose_demo_net
