events {}

http {
  server {
    listen 80;

    location / {
      root /usr/share/nginx/html;
      index index.html;
      sub_filter '__WEB_PAGE_COLOR__' 'green';
      sub_filter_once on;
    }

    # proxy /api/* to the api container
    location /api/ {
      proxy_pass http://api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
